name: Build macOS app

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build, e.g. v1.3.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.2

      - name: Build .icns
        run: |
          set -e
          mkdir -p icon.iconset
          sips -z 16 16 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_512x512.png >/dev/null
          cp assets/icons/gomoku-ds-master.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o app.icns

      - name: Build app
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "QifengXiaojing-${RELEASE_TAG}" \
            --icon app.icns \
            --add-data "assets:assets" \
            play.py

      - name: Package app
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "QifengXiaojing-${RELEASE_TAG}.app" "QifengXiaojing-${RELEASE_TAG}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*-macos.zip
          if-no-files-found: error
