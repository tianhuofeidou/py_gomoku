name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and attach
        required: true
        default: v1.2.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.2

      - name: Build .icns
        run: |
          set -e
          mkdir -p icon.iconset
          sips -z 16 16 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/icons/gomoku-ds-master.png --out icon.iconset/icon_512x512.png >/dev/null
          cp assets/icons/gomoku-ds-master.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o app.icns

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "QifengXiaojing-v1.2.0" \
            --icon app.icns \
            --add-data "assets:assets" \
            play.py

      - name: Package app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "QifengXiaojing-v1.2.0.app" "QifengXiaojing-v1.2.0-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QifengXiaojing-v1.2.0-macos
          path: dist/QifengXiaojing-v1.2.0-macos.zip

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Qifeng Xiaojing $TAG"
          fi
          gh release upload "$TAG" "dist/QifengXiaojing-v1.2.0-macos.zip" --clobber
